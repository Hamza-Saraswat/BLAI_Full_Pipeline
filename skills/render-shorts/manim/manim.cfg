# BLAI vertical (9:16 / YouTube Shorts) render config -- Manim CE v0.20.x
#
# Canvas: 1080x1920 @ 30 fps.  Logical frame: 8.0 x 14.2222 scene units.
#
# IMPORTANT (verified empirically + in manim/_config/utils.py:669-674, v0.20.1):
# manim only ever derives frame_width FROM frame_height
# (frame_width = frame_height * pixel_aspect); frame_height is NEVER derived.
# Setting only frame_width=8.0 leaves frame_height at its 8.0 default =>
# anisotropic units (135 px/u horizontal vs 240 px/u vertical) = distorted
# geometry.  So in portrait, frame_height MUST be set.  We pin BOTH:
#     frame_height = 8.0 * 1920/1080 = 128/9 = 14.222222222222222
#     frame_width  = 8.0   (would also derive to 8.0 from frame_height)
# => 1 scene unit = 135 px on both axes at 1080x1920.
#
# WARNING: quality flags (-ql / -qm / -qh / -qp / -qk) override pixel dims
# with LANDSCAPE presets (e.g. -ql => 854x480) while the logical frame stays
# portrait => squished output.  Never use -q* with this config.
# Draft renders: use  -r 540,960 --fps 15  instead (see SETUP-NOTES.md).

[CLI]
pixel_width = 1080
pixel_height = 1920
frame_rate = 30
frame_height = 14.222222222222222
frame_width = 8.0
