<!doctype html>
<!-- ============================================================
  PACK SNIPPET: silicon — trace routing + pulse + chip + silkscreen
  (skills/render-shorts/styles/silicon.md — matte-black circuit board)

  This file is BOTH the reference snippet and a renderable 5s hello
  composition. Asset paths are PROJECT-ROOT-relative ("packs/...")
  because scene workers author index.html at the project root:
      cp packs/silicon-snippet.html index.html && npx hyperframes lint

  Signature techniques shown here:
    1. board grid background (.board-bg — static, full-bleed;
       Y~31, legal in the UI margins)
    2. trace routing draw-on: 45°/90° bends ONLY (every segment
       horizontal/vertical or |dx| == |dy|); pathLength="1" +
       stroke-dasharray:1, tween stroke-dashoffset 1 -> 0
       (dasharray fallback — bundled GSAP is core only)
    3. signal pulse: a short amber dash (dasharray "0.08 1.92",
       pathLength 1) travels the routed trace — dashoffset
       0.08 -> -1.0, LINEAR — while an energized amber copy
       (stacked-stroke glow, .lit x3) draws behind it at the
       same rate. Glow = stacked strokes, NEVER filter: blur.
    4. component placement: chip drops onto its footprint
       (opacity 0->1, scale 1.15->1, power3.out); pads flash
       amber on contact (.set — machine-instant), settle to tin
    5. via pop at the trace endpoint — back.out(1.3), the one
       sanctioned overshoot
    6. silkscreen annotation: dashed callout FADES in (dashes
       never draw), reference designator types via the seek-safe
       proxy-slice pattern (floor = stepped, machine indexing)
  Easing: machine-placement — power2.inOut routing, LINEAR
  pulses, power3.out drops, no wobble ever.
  Bright elements (amber/tin/silkscreen) stay inside .safe; only
  bg + board grid touch the margins.
  First 8 and last 8 frames are motion-free.
============================================================ -->
<!-- TRAPS (verified 2026-08-29, first live use): (1) .board-bg must sit INSIDE the
     composition root div; as a body-level sibling the linter mistakes it for the root
     and throws root_missing_composition_id/dimensions. (2) Scope every GSAP selector
     to the root ("#scene .pad", never ".pad") or 0.7.31 lint fails unscoped_gsap_selector.
     (3) The pack's .label/.designator/.value/.fab-mark classes are CHROME (<64px);
     viewer-read text needs scene-local sizes >=64px. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="packs/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="packs/silicon.css" />
    <style>
      /* snippet-local layout only — all tokens/type come from the pack CSS */
      .hook { position: absolute; top: 0; left: 0; }
      #chip { left: 295px; top: 640px; width: 240px; height: 240px; }
      #silk-callout { left: 570px; top: 585px; width: 210px; height: 72px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <!-- 1) static full-bleed board grid -->
      <div class="board-bg"></div>

      <div
        id="scene"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      >
        <div class="safe">
          <!-- hook: Chakra Petch headline, on screen at frame 1 -->
          <h1 class="headline hook">
            SHRINK THE<br />
            <span class="accent">NUMBERS</span>
          </h1>

          <!-- board layer (viewBox = safe area px). Trace route:
               H, 45° (dx=140 == dy=140), H — the 45°/90° law. -->
          <div class="board-layer">
            <svg viewBox="0 0 830 1020" xmlns="http://www.w3.org/2000/svg">
              <!-- 2) copper routes first, UNLIT -->
              <path
                id="trace-unlit"
                class="trace-unlit"
                d="M 60 380 L 250 380 L 390 520 L 610 520"
                pathLength="1"
                style="stroke-dasharray: 1; stroke-dashoffset: 1"
              />

              <!-- 3a) energized copy — stacked-stroke glow (wide->thin),
                   draws behind the pulse at the same LINEAR rate -->
              <path class="lit glow-wide" d="M 60 380 L 250 380 L 390 520 L 610 520"
                    pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1" />
              <path class="lit glow-mid" d="M 60 380 L 250 380 L 390 520 L 610 520"
                    pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1" />
              <path class="lit glow-core" d="M 60 380 L 250 380 L 390 520 L 610 520"
                    pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1" />

              <!-- 3b) the pulse: short dash, gap longer than the path so it
                   is invisible before the start and after the end -->
              <path class="pulse pulse-wide" d="M 60 380 L 250 380 L 390 520 L 610 520"
                    pathLength="1"
                    style="stroke-dasharray: 0.08 1.92; stroke-dashoffset: 0.08" />
              <path class="pulse pulse-core" d="M 60 380 L 250 380 L 390 520 L 610 520"
                    pathLength="1"
                    style="stroke-dasharray: 0.08 1.92; stroke-dashoffset: 0.08" />

              <!-- 5) via at the trace endpoint (annulus + hole);
                   hidden by inline opacity until it pops -->
              <g id="via" style="opacity: 0">
                <circle class="via-glow" cx="610" cy="520" r="16" />
                <circle class="via-ring" cx="610" cy="520" r="16" />
                <circle class="via-hole" cx="610" cy="520" r="7" />
              </g>
            </svg>
          </div>

          <!-- 4) footprint pads — visible from frame 1 as unlit copper,
               flash amber when the chip lands, settle to tin -->
          <span class="pad" style="left: 262px; top: 667px"></span>
          <span class="pad" style="left: 262px; top: 703px"></span>
          <span class="pad" style="left: 262px; top: 739px"></span>
          <span class="pad" style="left: 262px; top: 775px"></span>
          <span class="pad" style="left: 262px; top: 811px"></span>
          <span class="pad" style="left: 262px; top: 847px"></span>
          <span class="pad" style="left: 536px; top: 667px"></span>
          <span class="pad" style="left: 536px; top: 703px"></span>
          <span class="pad" style="left: 536px; top: 739px"></span>
          <span class="pad" style="left: 536px; top: 775px"></span>
          <span class="pad" style="left: 536px; top: 811px"></span>
          <span class="pad" style="left: 536px; top: 847px"></span>

          <!-- the chip: FILLED rounded rect + pin stubs + mono die label -->
          <div id="chip" class="chip" style="opacity: 0">
            <span class="chip-pin chip-pin--l" style="top: 30px"></span>
            <span class="chip-pin chip-pin--l" style="top: 66px"></span>
            <span class="chip-pin chip-pin--l" style="top: 102px"></span>
            <span class="chip-pin chip-pin--l" style="top: 138px"></span>
            <span class="chip-pin chip-pin--l" style="top: 174px"></span>
            <span class="chip-pin chip-pin--l" style="top: 210px"></span>
            <span class="chip-pin chip-pin--r" style="top: 30px"></span>
            <span class="chip-pin chip-pin--r" style="top: 66px"></span>
            <span class="chip-pin chip-pin--r" style="top: 102px"></span>
            <span class="chip-pin chip-pin--r" style="top: 138px"></span>
            <span class="chip-pin chip-pin--r" style="top: 174px"></span>
            <span class="chip-pin chip-pin--r" style="top: 210px"></span>
            <span class="chip-pin1"></span>
            <div class="chip-label">GPU</div>
          </div>

          <!-- 6) silkscreen callout: dashed box fades, designator types -->
          <div id="silk-callout" class="silk-box" style="opacity: 0">
            <span id="designator" class="designator">VRAM0</span>
          </div>

          <!-- quiet corner motif, static from frame 1 -->
          <div class="fab-mark">BLAI &middot; REV 04</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 2) trace routes across the board — machine placement, power2.inOut
      tl.to("#trace-unlit", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.35);

      // 3) signal flows: LINEAR pulse leads (head at 1.08t), the energized
      //    amber copy lights behind it (edge at t) — copper becomes light
      tl.to(".lit", { strokeDashoffset: 0, duration: 0.8, ease: "none" }, 1.5);
      tl.to(".pulse", { strokeDashoffset: -1.0, duration: 0.8, ease: "none" }, 1.5);

      // 5) via pops where the pulse lands — slight overshoot, back.out(1.3)
      tl.set("#via", { opacity: 1 }, 2.3);
      tl.fromTo(
        "#via",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.4, ease: "back.out(1.3)" },
        2.3
      );

      // 4) chip drops onto its footprint — scale 1.15 -> 1, power3.out
      tl.fromTo(
        "#chip",
        { opacity: 0, scale: 1.15 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        2.6
      );
      // pads flash amber on contact (machine-instant .set), settle to tin
      tl.set("#scene .pad", { backgroundColor: "#FFB347" }, 3.05); /* --accent */
      tl.to(".pad", { backgroundColor: "#8FA0A8", duration: 0.4, ease: "power2.inOut" }, 3.25); /* --tin */

      // 6) silkscreen: dashed box FADES in (dashes never draw), then the
      //    designator types — seek-safe proxy slice (floor = stepped)
      tl.to("#silk-callout", { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 3.35);
      const desEl = document.getElementById("designator");
      const desText = desEl.textContent;
      desEl.textContent = "";
      const type = { n: 0 };
      tl.to(
        type,
        {
          n: desText.length,
          duration: 0.09 * desText.length, // 5 chars -> 0.45s
          ease: "none",
          onUpdate: () => {
            desEl.textContent = desText.slice(0, Math.floor(type.n));
          },
        },
        3.65
      );
      // motion ends 4.10s — last 8 frames (4.73s+) are stable

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
